# Must match the Worker that Cloudflare's build system deploys to, which it
# names after the repository. A mismatch only warns today, but it is the kind of
# thing that quietly creates a second Worker on some future deploy.
name = "tower-control"
main = "worker.js"
compatibility_date = "2026-01-01"

# Give us a https://tower-sync.<subdomain>.workers.dev address. That URL is what
# goes into the game's parent screen; no custom domain is needed.
workers_dev = true

# The KV namespace that holds the saves.
#
# This id is not a secret — it names a namespace, it does not grant access to
# one. Reaching it still requires the account. Committing it is the normal thing
# to do, and it has to be committed here: this Worker is built from the repo, so
# a binding added by hand in the dashboard would be overwritten by the next
# build. Declared in the file, it survives every deploy.
[[kv_namespaces]]
binding = "TOWER"
id = "8e500af018654257a1f3f13209197791"

# No expiration is set. The saves are small and the log is already capped
# client-side, so a child who does not play for six months should still find his
# album exactly where he left it.
