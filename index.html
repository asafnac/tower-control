<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מִגְדַּל הַפִּיקּוּחַ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Airport background scene (behind all screens) -->
  <div id="airport-bg" class="airport-bg" aria-hidden="true">
    <div class="bg-stars"></div>
    <div class="bg-moon"></div>
    <div class="bg-horizon"></div>
    <div class="bg-ground"></div>
    <div class="bg-runway"><div class="bg-runway-center"></div></div>
    <div class="bg-taxiway"></div>
    <div class="bg-terminal"><div class="bg-terminal-roof"></div></div>
    <div class="bg-tower">
      <div class="bg-tower-beacon"></div>
      <div class="bg-tower-cab"></div>
      <div class="bg-tower-shaft"></div>
      <div class="bg-tower-base"></div>
    </div>
    <span class="bg-plane bp1">✈</span>
    <span class="bg-plane bp2">✈</span>
    <span class="bg-plane bp3">✈</span>
    <span class="bg-plane bp4">✈</span>
    <span class="bg-plane bp5">✈</span>
  </div>

  <!-- Correct-answer celebration overlay -->
  <div id="celebrate-overlay" class="celebrate-overlay" aria-hidden="true">
    <div class="celebrate-confetti" id="celebrate-confetti"></div>
    <div class="celebrate-content">
      <span class="celebrate-plane">✈️</span>
      <p class="celebrate-bravo">כׇּל הַכָּבוֹד!</p>
      <p id="celebrate-name" class="celebrate-name"></p>
      <p class="celebrate-sub">אַתָּה פַּקָּח מְצֻיָּן!</p>
    </div>
  </div>

  <!-- Screen 1: Entry -->
  <div id="screen-entry" class="screen">
    <div class="screen-content">
      <h1 class="game-title">מִגְדַּל הַפִּיקּוּחַ</h1>
      <p class="game-subtitle">✈️ בָּרוּךְ הַבָּא, פַּקָּח!</p>
      <div class="entry-form">
        <label for="player-name">מַה שִּׁמְךָ?</label>
        <input type="text" id="player-name" placeholder="הַקְלֵד אֶת שִׁמְךָ" maxlength="12">
        <button id="btn-start" class="btn-primary">הַתְחֵל מִשְׁמֶרֶת</button>
        <div class="entry-nav">
          <button id="btn-show-album" class="btn-secondary">אַלְבּוּם מְטוֹסִים ✈️</button>
          <button id="btn-show-map"   class="btn-secondary">מַפַּת נְמָלִים 🗺️</button>
        </div>
      </div>
      <div id="entry-mission" class="mission-card hidden"></div>
      <div id="entry-stats" class="entry-stats hidden"></div>
      <div id="entry-rank" class="rank-badge hidden"></div>
      <button id="btn-sound" class="btn-sound" title="צְלִילִים">🔊</button>
    </div>
  </div>

  <!-- Screen 2: Game -->
  <div id="screen-game" class="screen hidden">
    <div class="game-header">
      <span id="hdr-rank" class="rank-small"></span>
      <span id="hdr-name" class="player-name-small"></span>
      <span id="hdr-combo" class="combo-badge hidden"></span>
      <span id="hdr-shift" class="shift-label"></span>
      <span id="hdr-progress" class="shift-progress"></span>
    </div>

    <div class="game-main">
      <!-- Radar / Visual area -->
      <div id="radar-area" class="radar-area">
        <div id="radar-screen" class="radar-screen">
          <div class="radar-sweep"></div>
          <div id="radar-planes" class="radar-planes"></div>
        </div>
        <!-- Altitude meter (shown for altitude-type questions) -->
        <div id="altitude-meter" class="altitude-meter hidden">
          <div class="alt-scale">
            <div id="alt-fill" class="alt-fill"></div>
            <div id="alt-ticks" class="alt-ticks"></div>
          </div>
          <div id="alt-number" class="alt-number">0</div>
          <div id="alt-decompose" class="alt-decompose hidden">
            <span id="decompose-ten" class="decompose-ten">10</span>
            <span class="decompose-plus">+</span>
            <span id="decompose-units" class="decompose-units">0</span>
          </div>
        </div>
      </div>

      <!-- Radio message -->
      <div id="radio-bubble" class="radio-bubble">
        <span class="radio-icon">📻</span>
        <span id="radio-text" class="radio-text"></span>
        <button id="btn-speak" class="btn-speak" title="הַקְרֵא אֶת הַשְּׁאֵלָה">🔊</button>
      </div>

      <!-- Safety-station ladder (ten-crossing questions) -->
      <button id="btn-bridge" class="btn-bridge hidden">🔟 פָּרֵק לִי דֶּרֶךְ תַּחֲנַת הָעֲשָׂרָה</button>
      <div id="bridge-panel" class="bridge-panel hidden">
        <div id="bridge-rungs" class="bridge-rungs"></div>
      </div>

      <!-- Hint area -->
      <div id="hint-area" class="hint-area hidden">
        <div id="hint-dots" class="hint-dots"></div>
        <p id="hint-text" class="hint-text"></p>
      </div>
    </div>

    <!-- Number pad -->
    <div class="numpad-area">
      <div id="answer-display" class="answer-display">
        <span id="answer-value">—</span>
      </div>
      <div class="numpad">
        <button class="num-btn" data-n="1">1</button>
        <button class="num-btn" data-n="2">2</button>
        <button class="num-btn" data-n="3">3</button>
        <button class="num-btn" data-n="4">4</button>
        <button class="num-btn" data-n="5">5</button>
        <button class="num-btn" data-n="6">6</button>
        <button class="num-btn" data-n="7">7</button>
        <button class="num-btn" data-n="8">8</button>
        <button class="num-btn" data-n="9">9</button>
        <button class="num-btn num-clear" data-n="clear">✕</button>
        <button class="num-btn" data-n="0">0</button>
        <button id="btn-submit" class="num-btn num-submit" disabled>✔</button>
      </div>
    </div>
  </div>

  <!-- Screen 3: Shift Report -->
  <div id="screen-report" class="screen hidden">
    <div class="screen-content">
      <h2 class="report-title">דּוּחַ מִשְׁמֶרֶת</h2>
      <div id="report-planes" class="report-planes"></div>
      <p id="report-msg" class="report-msg"></p>
      <div id="report-stats" class="report-stats"></div>
      <div id="report-new-plane" class="new-plane-badge hidden"></div>
      <div id="report-rank-up" class="rank-up hidden"></div>
      <button id="btn-continue" class="btn-primary">הַמְשֵׁךְ</button>
    </div>
  </div>

  <!-- Screen 4: Plane Album -->
  <div id="screen-album" class="screen hidden">
    <div class="screen-content">
      <h2>אַלְבּוּם הַמְּטוֹסִים שֶׁלִּי</h2>
      <p id="album-count" class="album-count"></p>
      <div id="album-grid" class="album-grid"></div>
      <button id="btn-album-back" class="btn-secondary">חֲזוֹר</button>
    </div>
  </div>

  <!-- Screen 5: Airport Map -->
  <div id="screen-map" class="screen hidden">
    <div class="screen-content">
      <h2>מַפַּת הַנְּמָלִים</h2>
      <div id="map-stages" class="map-stages"></div>
      <button id="btn-map-back" class="btn-secondary">חֲזוֹר</button>
    </div>
  </div>

  <!-- Screen 6: Landing Mini-Game -->
  <div id="screen-landing" class="screen hidden">
    <p id="landing-title" class="landing-title"></p>
    <div id="landing-sky" class="landing-sky">
      <div id="landing-plane" class="landing-plane-el"></div>
      <div class="landing-ground">
        <div class="landing-runway">
          <div class="landing-zone" id="landing-zone"></div>
        </div>
        <!-- runway lights -->
        <div class="runway-lights">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>
    <div class="landing-controls">
      <button id="btn-land" class="btn-land"></button>
      <p id="landing-msg" class="landing-msg"></p>
    </div>
  </div>

  <script src="js/curriculum.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
